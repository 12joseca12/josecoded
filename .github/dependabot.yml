version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(infra)" }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "07:00", timezone: Europe/Madrid }
    commit-message: { prefix: "chore(infra)" }
    groups:
      actions:
        patterns: ["*"]
