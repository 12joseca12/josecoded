name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENABLE_DEV_PAGES: "true"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  # Decides whether the PR touches the app. Any failure or doubt leaves app=true
  # (run everything). .github/ is deliberately not in the "not app" list, so a
  # workflow change always runs the full suite.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          app=true
          if [ "$EVENT" = pull_request ]; then
            if files="$(git diff --no-renames --name-only "$BASE...$HEAD")" && [ -n "$files" ] &&
               ! printf '%s\n' "$files" | grep -qvE '^(\.claude/|docs/|[^/]+\.md$|lefthook\.yml$|\.gitleaks\.toml$)'; then
              app=false
            fi
          fi
          echo "files changed:"; printf '%s\n' "${files:-}" | sed 's/^/  /'
          echo "app=$app" >> "$GITHUB_OUTPUT"

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:rules
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm content:check
      - run: pnpm tokens:check
      - run: pnpm tokens:test
      - run: pnpm og:check
      - run: pnpm test

  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - if: matrix.shard == 1
        run: pnpm perf:budget --verbose
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --shard="$E2E_SHARD"

  db:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: bash supabase/local/run-tests.sh

  checks:
    if: always()
    needs: [changes, static, e2e, db]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          APP: ${{ needs.changes.outputs.app }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          E2E: ${{ needs.e2e.result }}
          DB: ${{ needs.db.result }}
        run: |
          echo "changes=$CHANGES (app=$APP) static=$STATIC e2e=$E2E db=$DB"
          [ "$CHANGES" = "success" ] || exit 1
          [ "$STATIC" = "success" ] || exit 1
          for result in "$E2E" "$DB"; do
            [ "$result" = "success" ] && continue
            [ "$result" = "skipped" ] && [ "$APP" = "false" ] && continue
            exit 1
          done
