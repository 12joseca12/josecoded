name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENABLE_DEV_PAGES: "true"
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm lint:rules
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm content:check
      - run: pnpm tokens:check
      - run: pnpm tokens:test
      - run: pnpm og:check
      - run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'content/**', 'messages/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - if: matrix.shard == 1
        run: pnpm perf:budget --verbose
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --shard="$E2E_SHARD"

  db:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
      - env:
          PGBIN: /usr/lib/postgresql/16/bin
        run: bash supabase/local/run-tests.sh

  checks:
    if: always()
    needs: [static, e2e, db]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ needs.static.result }} ${{ needs.e2e.result }} ${{ needs.db.result }}
        run: |
          echo "static e2e db: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
