# CI (plan 1.9). No production credentials live here: the only Supabase is the local stack of `supabase start`.
# Third-party actions are pinned by full commit SHA (version in the trailing comment); bump them on purpose.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by update-snapshots.yml after it commits baselines (GITHUB_TOKEN pushes don't trigger `push`).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Public build-time variables (not secrets): apps/web validates them with zod and fails the build
# if one is missing. Same values as apps/web/.env.example.
env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_JOSECODED_API_URL: http://localhost:8787
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  NEXT_PUBLIC_CAL_LINK: josecoded/20min
  NEXT_PUBLIC_WHATSAPP_NUMBER: '34600000000'
  NEXT_PUBLIC_HERO_MEDIA_VERSION: '1'
  NEXT_PUBLIC_SITE_ENV: development
  NEXT_PUBLIC_DEV_UI: '1'
  # build-info.ts: a pull_request run checks out a merge commit; the real head SHA is only in the event payload.
  GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  # Supabase CLI used by the `test` job (pinned; keep it equal to the one on Jose's Mac, `supabase --version`).
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Duplicated blocks (working-agreements §15.4). Not installed in the repo: pnpm dlx.
      - run: >-
          pnpm dlx jscpd@5.4.0 apps packages
          --min-lines 30 --min-tokens 120 --threshold 0
          --ignore "**/*.test.*,**/database.ts,**/tokens.*,**/content/**,**/node_modules/**"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Unit tests AND the tests that need a real database. GitHub sets CI=true, and both
  # apps/web/tests/rls.test.ts and packages/types/test/database-drift.test.ts turn "Supabase local not reachable" into a
  # failure when CI is set (outside CI they skip with a warning), so the stack must be up before `pnpm test`: the drift
  # check and the RLS suite can never be skipped silently here. `pnpm test` (turbo) runs them together with every other
  # package's tests, so there is no second invocation of the same files.
  #
  # supabase/test/pg/run.sh (the vanilla-Postgres twin of the SQL assertions) is NOT run here: it exists for cloud
  # sessions without Docker, and a real Supabase stack is the reference that already applies the same migrations and
  # seed (`db reset`) and runs the TS RLS tests.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Only what the tests use: API (kong, postgrest), auth, realtime, storage and postgres-meta (`gen types --local`
      # needs it for the drift check). Excluded: studio, imgproxy, edge-runtime (no functions, Q2), logflare + vector
      # (analytics), mailpit (no email is read in tests) and supavisor.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      # Applies supabase/migrations and supabase/seed/seed.sql from scratch, exactly as the repo describes the schema.
      - run: supabase db reset
      - run: pnpm test
      - if: failure()
        run: supabase status || true
      - if: always()
        run: supabase stop --no-backup

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Not wired yet because the scripts do not exist: check:hero-bundle and hero:media:check (task 2.9) and the
      # Lighthouse CI run (`pnpm lhci`, task 2.9). Each of those tasks adds its step here.

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @josecoded/web exec playwright install --with-deps chromium
      # The URL matrix runs against the LOCAL preview (`opennextjs-cloudflare preview`, which
      # populates the cache like production). Nothing is uploaded to Cloudflare.
      - run: pnpm e2e
      # Not wired yet: the visual diff against the prototype (`pnpm visual`, task 2.13). The E2E against `wrangler dev`
      # of the gateway + Supabase local is added by the first task whose UI signs in.
