# Production deploy (plan 1.9). MANUAL ONLY (`workflow_dispatch`) and only with Jose's explicit OK in the session:
# a production deploy is a gate. It NEVER runs migrations or any `supabase` command: the schema is applied by the
# controller with `supabase db push` from Jose's Mac (docs/runbooks/supabase-gate.md).
#
# Needs:
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_TURNSTILE_SITE_KEY,
#              NEXT_PUBLIC_JOSECODED_API_URL (https://api.josecoded.com), NEXT_PUBLIC_SITE_URL (https://josecoded.com)
#   environment `production` (Settings → Environments; Jose adds himself as required reviewer)
# The gateway Worker secrets live in Cloudflare (`wrangler secret put`, apps/api/DEPLOY.md §2), never in this repo.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [api, web, both]
        default: api

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Production only ever ships from main (squash-merged, protected).
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_JOSECODED_API_URL: ${{ vars.NEXT_PUBLIC_JOSECODED_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_CAL_LINK: ${{ vars.NEXT_PUBLIC_CAL_LINK || 'josecoded/20min' }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      NEXT_PUBLIC_HERO_MEDIA_VERSION: '1'
      NEXT_PUBLIC_SITE_ENV: production
      # NEXT_PUBLIC_DEV_UI is deliberately absent: the /dev/ui catalogue never ships to production.
      API_BASE: https://api.josecoded.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # apps/api/DEPLOY.md §4: with API_MODE=development the gateway returns error.message and mounts /api/dev/*.
      # The top level of wrangler.jsonc is the production Worker; refuse to continue unless it says `production`.
      - name: Require API_MODE=production in wrangler.jsonc
        shell: bash
        run: |
          mode="$(node -e "
            const ts = require('typescript');
            const text = require('fs').readFileSync('apps/api/wrangler.jsonc', 'utf8');
            const parsed = ts.parseConfigFileTextToJson('wrangler.jsonc', text);
            if (parsed.error) { console.error('wrangler.jsonc does not parse'); process.exit(2); }
            process.stdout.write(String(parsed.config?.vars?.API_MODE ?? ''));
          ")"
          if [ "$mode" != "production" ]; then
            echo "::error title=API_MODE::apps/api/wrangler.jsonc top-level vars.API_MODE is '$mode', expected 'production'. Refusing to deploy."
            exit 1
          fi

      - name: Gateway tests and typecheck
        if: ${{ inputs.target != 'web' }}
        run: |
          pnpm --filter josecoded-api typecheck
          pnpm --filter josecoded-api test

      # Top-level Worker = production (`josecoded-api`), no --env.
      - name: Deploy gateway
        if: ${{ inputs.target != 'web' }}
        run: pnpm --filter josecoded-api exec wrangler deploy

      # Smoke after the gateway deploy (apps/api/DEPLOY.md §6). `curl --retry` absorbs the propagation delay.
      - name: Smoke gateway
        if: ${{ inputs.target != 'web' }}
        shell: bash
        run: |
          status() { curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$@"; }
          fail=0
          expect() { # <expected codes, space separated> <label> <url>
            local codes="$1" label="$2" got; shift 2
            got="$(status "$@")"
            case " $codes " in *" $got "*) echo "ok   $label -> $got" ;; *) echo "::error title=Smoke::$label -> $got (expected $codes)"; fail=1 ;; esac
          }
          expect "200" "GET /api/v1/health" "$API_BASE/api/v1/health"
          expect "200" "GET /health" "$API_BASE/health"
          expect "401" "GET /api/v1/auth/me without JWT" "$API_BASE/api/v1/auth/me"
          # retired in 1.8c (DATOS §9): they must not answer 2xx or 5xx (the protected wildcard returns 401, a bare 404 is fine too)
          for path in /api/v1/forum/posts /api/v1/admin-chat/threads /forum/posts /admin-chat/threads; do
            expect "401 404" "GET $path (retired)" "$API_BASE$path"
          done
          exit "$fail"

      # The web app goes through opennextjs-cloudflare (it runs populateCache), NEVER a bare `wrangler deploy`.
      - name: Build and deploy web
        if: ${{ inputs.target != 'api' }}
        run: |
          pnpm --filter @josecoded/web exec opennextjs-cloudflare build
          pnpm --filter @josecoded/web exec opennextjs-cloudflare deploy

      - name: Smoke web
        if: ${{ inputs.target != 'api' }}
        shell: bash
        run: |
          got="$(curl -sS -o /dev/null -w '%{http_code}' -L --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$NEXT_PUBLIC_SITE_URL/")"
          if [ "$got" != "200" ]; then echo "::error title=Smoke::GET $NEXT_PUBLIC_SITE_URL/ -> $got"; exit 1; fi
          echo "ok   GET $NEXT_PUBLIC_SITE_URL/ -> $got"
