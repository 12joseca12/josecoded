# DISABLED until Cloudflare credentials exist in CI (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID).
# Until then Jose approves previews locally (`pnpm dev` / `opennextjs-cloudflare preview`).
#
# To enable: replace the `workflow_dispatch` trigger with `pull_request`, remove `if: ${{ false }}`
# from the job and add the secrets. Uses `opennextjs-cloudflare upload` (it runs populateCache),
# NEVER a bare `wrangler versions upload`.
name: Preview (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec opennextjs-cloudflare build
      - run: pnpm --filter web exec opennextjs-cloudflare upload
      # The gateway preview (`josecoded-api-preview`, own secrets) and the PR comment with the
      # preview URLs are wired up in task 1.9.
