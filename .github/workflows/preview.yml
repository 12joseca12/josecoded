# Preview deploys (plan 1.9): `josecoded-api-preview` (gateway, `--env preview`) and a web version preview, per PR.
# Runs only when the Cloudflare credentials exist AND the PR comes from this repository (forks never get secrets);
# otherwise the job ends green with a notice. Previews never deploy migrations and never touch production Workers.
# The preview Worker keeps its OWN secrets (`wrangler secret put --env preview`, apps/api/DEPLOY.md §2), set by hand at
# the Supabase gate (runbook step 9), not by this workflow.
#
# Needs (Settings → Secrets and variables → Actions):
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY (public values of the new project),
#              NEXT_PUBLIC_TURNSTILE_SITE_KEY, NEXT_PUBLIC_JOSECODED_API_URL (the josecoded-api-preview URL),
#              NEXT_PUBLIC_SITE_URL (optional; defaults to the preview-less production origin)
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://josecoded.com' }}
      NEXT_PUBLIC_JOSECODED_API_URL: ${{ vars.NEXT_PUBLIC_JOSECODED_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_CAL_LINK: ${{ vars.NEXT_PUBLIC_CAL_LINK || 'josecoded/20min' }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER || '34600000000' }}
      NEXT_PUBLIC_HERO_MEDIA_VERSION: '1'
      # exposes the /dev/ui catalogue (task 2.2) in previews only; absent in deploy-production.yml
      NEXT_PUBLIC_DEV_UI: '1'
    steps:
      - name: Check credentials and origin
        id: guard
        shell: bash
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          missing=""
          [ "$SAME_REPO" = "true" ] || missing="$missing (PR from a fork)"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] || missing="$missing vars.NEXT_PUBLIC_SUPABASE_URL"
          [ -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ] || missing="$missing vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          [ -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ] || missing="$missing vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY"
          [ -n "$NEXT_PUBLIC_JOSECODED_API_URL" ] || missing="$missing vars.NEXT_PUBLIC_JOSECODED_API_URL"
          if [ -n "$missing" ]; then
            echo "::notice title=Preview skipped::Not deploying a preview, missing:$missing"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.guard.outputs.run == 'true'
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.guard.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      # Gateway preview: own Worker, own secrets, no cron, API_MODE=development (apps/api/wrangler.jsonc `env.preview`).
      - name: Deploy gateway preview
        if: steps.guard.outputs.run == 'true'
        run: pnpm --filter josecoded-api exec wrangler deploy --env preview
      # `opennextjs-cloudflare upload` populates the cache and creates a version without promoting it; NEVER a bare
      # `wrangler versions upload` for the web app.
      - name: Build and upload web preview
        id: web
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          pnpm --filter @josecoded/web exec opennextjs-cloudflare build
          pnpm --filter @josecoded/web exec opennextjs-cloudflare upload 2>&1 | tee "$RUNNER_TEMP/upload.log"
          url="$(grep -oE 'https://[a-z0-9-]+-josecoded-web\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/upload.log" | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment the preview URLs on the PR
        if: steps.guard.outputs.run == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          WEB_URL: ${{ steps.web.outputs.url }}
          API_URL: ${{ vars.NEXT_PUBLIC_JOSECODED_API_URL }}
        with:
          script: |
            const marker = '<!-- josecoded-preview -->';
            const body = [
              marker,
              '**Preview**',
              '',
              `- Web: ${process.env.WEB_URL || '(URL not found in the upload log; see the workflow run)'}`,
              `- Gateway (preview Worker): ${process.env.API_URL}`,
              '',
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
