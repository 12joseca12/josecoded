name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the official release checksums
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Official gitleaks binary (not gitleaks-action) so the scan range is explicit:
      # only the commits of the PR / push / last week, never the full history.
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ "${PUSH_BEFORE//0/}" = "" ]; then range="-1 ${PUSH_AFTER}"; else range="${PUSH_BEFORE}..${PUSH_AFTER}"; fi ;;
            *) range="--since=8.days.ago ${PUSH_AFTER}" ;;
          esac
          echo "Scanning: $range"
          cfg=()
          [ -f .gitleaks.toml ] && cfg=(--config .gitleaks.toml)
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/gitleaks" git --redact --verbose "${cfg[@]}" --log-opts="$range" .

  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Informative for now: existing vulnerabilities are being triaged.
    # Remove continue-on-error once they are cleaned up so this job blocks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  pinned-actions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fail if an action is not pinned by SHA
        run: |
          ! grep -rhE '^\s*-?\s*uses:' .github/workflows | grep -vE 'uses: \./|@[0-9a-f]{40}(\s|$)'
