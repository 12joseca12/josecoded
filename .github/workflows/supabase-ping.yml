# Weekly liveness check of the gateway and of the Supabase project (plan 1.9; the Free plan pauses a project after a
# week without API traffic, and a silent outage is worse than a noisy one). On failure it messages Jose on Telegram
# directly, with its own bot token, so the alert does not depend on the gateway that may be what is down.
#
# Needs secrets: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY (project echlwywbucgbhwpncviy, both public-grade values),
#                TELEGRAM_PING_TOKEN, TELEGRAM_PING_CHAT_ID.
# Note: the plan prefers `GET https://api.josecoded.com/api/v1/system/health` (the gateway calling the system_health RPC
# and reporting a lagging outbox). That route does not exist yet (apps/api/src/routes-manifest.ts); until a task adds
# it, the gateway is checked on /api/v1/health and the project is hit directly. Replace GATEWAY_URL below then.
name: Supabase ping

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GATEWAY_URL: https://api.josecoded.com/api/v1/health
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TELEGRAM_PING_TOKEN: ${{ secrets.TELEGRAM_PING_TOKEN }}
      TELEGRAM_PING_CHAT_ID: ${{ secrets.TELEGRAM_PING_CHAT_ID }}
    steps:
      - name: Check gateway and Supabase
        id: ping
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error title=Ping::SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is not set as an Actions secret"
            exit 1
          fi
          status() { curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 "$@" || echo 000; }
          fail=0
          got="$(status "$GATEWAY_URL")"
          echo "gateway /api/v1/health -> $got"; [ "$got" = "200" ] || fail=1
          # GoTrue answers without any grant: proves the project is awake and Auth is up.
          got="$(status -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/auth/v1/health")"
          echo "supabase /auth/v1/health -> $got"; [ "$got" = "200" ] || fail=1
          # PostgREST root: anything below 500 means the API and the database behind it answer (anon has no grants).
          got="$(status -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/")"
          echo "supabase /rest/v1/ -> $got"; { [ "$got" -ge 200 ] && [ "$got" -lt 500 ]; } || fail=1
          exit "$fail"
      - name: Alert on Telegram
        if: ${{ failure() }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_PING_TOKEN" ] || [ -z "$TELEGRAM_PING_CHAT_ID" ]; then
            echo "::warning title=Ping::TELEGRAM_PING_TOKEN or TELEGRAM_PING_CHAT_ID missing: no alert sent"
            exit 0
          fi
          text="josecoded ping FAILED: gateway or Supabase did not answer. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS --fail --max-time 20 "https://api.telegram.org/bot${TELEGRAM_PING_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_PING_CHAT_ID}" \
            --data-urlencode "text=${text}" -o /dev/null
