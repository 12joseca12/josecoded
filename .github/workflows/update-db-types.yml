# Manual: regenerates packages/types/src/database.ts from the repo's migrations on a local Supabase, the same way the
# drift test does, and commits it. Never touches a remote project. Dispatches CI afterwards (bot pushes don't trigger it).
name: Update database types

on:
  workflow_dispatch:

concurrency:
  group: update-db-types-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  SUPABASE_CLI_VERSION: 2.122.0

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,supavisor
      - run: supabase db reset
      - run: pnpm --filter @josecoded/types db:types
      - name: Commit database.ts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/types/src/database.ts
          if git diff --cached --quiet; then
            echo "database.ts is up to date."
            exit 0
          fi
          git commit -m "chore(types): regenerate database.ts from migrations"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
