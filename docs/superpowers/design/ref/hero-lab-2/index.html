<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero-lab 2 · josecoded (Stitch + código real)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <span class="bar__name">josecoded</span>
  <span class="bar__right"><span>ES</span><span class="dim">EN</span></span>
</header>

<section class="hero" id="hero">
  <div class="hero__base" aria-hidden="true"></div>
  <canvas class="gl" id="gl" aria-hidden="true"></canvas>
  <div class="hero__blur" aria-hidden="true"></div>

  <div class="hero__content">
    <p class="kicker"><span class="dot"></span> disponible para proyectos</p>
    <h1 class="title" id="title" aria-label="Jose Carlos Sánchez">Jose Carlos Sánchez</h1>
    <p class="role">Desarrollador full-stack. React Native, Next.js, TypeScript, Supabase.</p>
    <div class="ctas">
      <a class="btn btn--primary" href="#">Proyectos</a>
      <a class="btn btn--ghost" href="#">Contacto</a>
    </div>
  </div>
  <a class="skip" href="#after" id="skip">Saltar</a>
</section>

<section class="after" id="after">
  <p>Aquí empieza el contenido. Este bloque solo existe para ver cómo termina el hero.</p>
</section>

<aside class="panel" id="panel" hidden>
  <div class="panel__row"><b>hero-lab 2</b><button id="replay" type="button">Repetir título</button></div>
  <label>velocidad flujo <input type="range" id="flow" min="0" max="2" step="0.05" value="0.5"><output>0.5</output></label>
  <label>columnas (por unidad) <input type="range" id="cols" min="1" max="14" step="0.5" value="5"><output>5</output></label>
  <label>brillo código <input type="range" id="bright" min="0" max="3" step="0.05" value="1.4"><output>1.4</output></label>
  <label>tamaño código <input type="range" id="scale" min="0.5" max="3" step="0.05" value="1.6"><output>1.6</output></label>
  <label>zona despejada <input type="range" id="clear" min="0.2" max="1.4" step="0.02" value="0.5"><output>0.5</output></label>
  <label>nodos: cadencia (s) <input type="range" id="cad" min="4" max="60" step="1" value="30"><output>30</output></label>
  <label>nodos: densidad <input type="range" id="dens" min="0" max="1" step="0.05" value="0.5"><output>0.5</output></label>
  <label>blur fondo (px) <input type="range" id="blur" min="0" max="40" step="1" value="14"><output>14</output></label>
  <label>blur: extensión <input type="range" id="blurext" min="0.4" max="1.6" step="0.05" value="1"><output>1</output></label>
  <label>blur: oscurecer <input type="range" id="blurdim" min="0" max="0.8" step="0.05" value="0.25"><output>0.25</output></label>
  <label>aura ratón <input type="range" id="aura" min="0" max="2" step="0.05" value="0.6"><output>0.6</output></label>
  <label>verde (destacar) <input type="range" id="green" min="0" max="1" step="0.05" value="0.15"><output>0.15</output></label>
  <p class="panel__fps"><span id="fps">–</span> fps · <span id="glinfo">gl: cargando</span></p>
</aside>

<script src="app.js?v=13" type="module"></script>
</body>
</html>
