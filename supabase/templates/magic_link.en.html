<!doctype html>
<!--
  Supabase Auth template: magic_link (signInWithOtp for an existing user: the 6-digit code is the main path).
  Locale: en. Subject (set it in the dashboard and, locally, in supabase/config.toml): josecoded: your sign-in code
  Variables (Go templates): {{ .Token }} 6-digit code, {{ .ConfirmationURL }}, {{ .Email }}, {{ .NewEmail }}, {{ .SiteURL }}.
  Copy for the `redactor` agent to review on the Mac (it does not run in cloud sessions): every visible string below.
  Dashboard: the template is one per type, so paste the combined es + en body built by docs/runbooks/supabase-gate.md
  (the region between the body:start and body:end markers of each file).
  Rules: OTP first (passwordless, DATOS Q4), no images, no external resources, inline styles only (mail clients drop <style>).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>josecoded: your sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f4f3fa;">
<!-- body:start -->
<div lang="en" style="max-width:32rem;margin:0 auto;padding:2rem 1.25rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1830;background:#ffffff;">
  <p style="margin:0 0 1.5rem;font-size:0.875rem;font-weight:600;letter-spacing:0.02em;color:#4b3fc9;">josecoded</p>
  <h1 style="margin:0 0 1rem;font-size:1.375rem;line-height:1.3;font-weight:600;color:#1a1830;">Your sign-in code</h1>
  <p style="margin:0 0 1rem;font-size:1rem;line-height:1.5;">Enter this code on the page where you asked to sign in:</p>
  <p style="margin:0 0 1.5rem;padding:1rem;background:#f4f3fa;border-radius:0.5rem;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:2rem;line-height:1.2;font-weight:700;letter-spacing:0.4em;color:#1a1830;">{{ .Token }}</p>
  <p style="margin:0 0 1.5rem;font-size:0.9375rem;line-height:1.5;">If you prefer, sign in with this link: <a href="{{ .ConfirmationURL }}" style="color:#4b3fc9;">{{ .ConfirmationURL }}</a></p>
  <p style="margin:0;font-size:0.8125rem;line-height:1.5;color:#55526b;">If you did not ask to sign in, ignore this message: nobody can get in without the code.</p>
</div>
<!-- body:end -->
</body>
</html>
